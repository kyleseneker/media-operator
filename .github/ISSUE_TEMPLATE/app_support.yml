name: Support a new app
description: Ask for a new app, or new settings on an app that's already supported
labels: [enhancement]
body:
  - type: input
    id: app
    attributes:
      label: App
      description: Name and a link to it.
      placeholder: "Huntarr — https://github.com/plexguide/Huntarr.io"
    validations:
      required: true

  - type: input
    id: api-docs
    attributes:
      label: API docs
      description: >
        A link to its API reference, OpenAPI/Swagger spec, or — failing that —
        whatever endpoint you found by watching its web UI in devtools. Without
        some form of this it's very hard to add support.

  - type: textarea
    id: settings
    attributes:
      label: What should be manageable
      description: >
        Which settings do you actually want in git? Being specific here helps a
        lot more than "full support" — most of these apps have hundreds of
        settings and only a dozen matter.
    validations:
      required: true

  - type: input
    id: auth
    attributes:
      label: How does it authenticate?
      description: API key header, bearer token, session cookie, something stranger?
