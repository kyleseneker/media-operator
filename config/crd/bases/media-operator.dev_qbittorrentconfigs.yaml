---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.23.0
  name: qbittorrentconfigs.media-operator.dev
spec:
  group: media-operator.dev
  names:
    kind: QBittorrentConfig
    listKind: QBittorrentConfigList
    plural: qbittorrentconfigs
    singular: qbittorrentconfig
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.conditions[?(@.type=="Synced")].status
      name: Synced
      type: string
    - jsonPath: .status.conditions[?(@.type=="Ready")].status
      name: Ready
      type: string
    - jsonPath: .status.lastSyncTime
      name: Last Sync
      type: date
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: QBittorrentConfig is the Schema for the qbittorrentconfigs API.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: QBittorrentConfigSpec defines the desired state of QBittorrentConfig.
            properties:
              categories:
                description: categories defines download categories and their save
                  paths.
                items:
                  description: QBittorrentCategory defines a download category with
                    its save path.
                  properties:
                    name:
                      description: name is the category name.
                      type: string
                    savePath:
                      description: savePath is the save path for this category.
                      type: string
                  required:
                  - name
                  type: object
                type: array
              connection:
                description: connection defines how to connect to the qBittorrent
                  instance.
                properties:
                  passwordSecretRef:
                    description: passwordSecretRef references a Secret containing
                      the password.
                    properties:
                      key:
                        description: key is the key within the Secret.
                        type: string
                      name:
                        description: name is the name of the Secret.
                        type: string
                    required:
                    - key
                    - name
                    type: object
                  tls:
                    description: |-
                      tls configures TLS settings for the connection.
                      Only needed when qBittorrent uses HTTPS with self-signed or private CA certificates.
                    properties:
                      caSecretRef:
                        description: |-
                          caSecretRef references a Secret containing a PEM-encoded CA certificate bundle
                          used to verify the target app's TLS certificate.
                          The Secret must contain the CA certificate under the specified key.
                        properties:
                          key:
                            description: key is the key within the Secret.
                            type: string
                          name:
                            description: name is the name of the Secret.
                            type: string
                        required:
                        - key
                        - name
                        type: object
                      insecureSkipVerify:
                        description: |-
                          insecureSkipVerify disables TLS certificate verification.
                          WARNING: This makes the connection susceptible to machine-in-the-middle attacks.
                          Only use for testing or when the target app uses a self-signed certificate and
                          providing a CA is not practical.
                        type: boolean
                    type: object
                  url:
                    description: url is the base URL of the qBittorrent Web UI (e.g.,
                      http://qbittorrent.media.svc.cluster.local:8080).
                    type: string
                  usernameSecretRef:
                    description: usernameSecretRef references a Secret containing
                      the username.
                    properties:
                      key:
                        description: key is the key within the Secret.
                        type: string
                      name:
                        description: name is the name of the Secret.
                        type: string
                    required:
                    - key
                    - name
                    type: object
                required:
                - passwordSecretRef
                - url
                - usernameSecretRef
                type: object
              preferences:
                description: preferences configures qBittorrent application preferences.
                properties:
                  addStoppedEnabled:
                    description: addStoppedEnabled adds new torrents stopped.
                    type: boolean
                  altDlLimit:
                    description: |-
                      altDlLimit is the download speed limit in KiB/s while the alternative
                      limits are on. 0 means unlimited.
                    minimum: 0
                    type: integer
                  altUpLimit:
                    description: |-
                      altUpLimit is the upload speed limit in KiB/s while the alternative limits
                      are on. 0 means unlimited.
                    minimum: 0
                    type: integer
                  anonymousMode:
                    description: anonymousMode hides the client's identity from peers
                      and trackers.
                    type: boolean
                  autoTmmEnabled:
                    description: |-
                      autoTmmEnabled puts new torrents in automatic management, which saves
                      them under their category's path.
                    type: boolean
                  bypassAuthSubnetWhitelist:
                    description: |-
                      bypassAuthSubnetWhitelist is the comma-separated list of subnets allowed to
                      skip the WebUI login.
                    type: string
                  bypassAuthSubnetWhitelistEnabled:
                    description: |-
                      bypassAuthSubnetWhitelistEnabled lets clients in the whitelisted subnets skip
                      the WebUI login, so an authenticating proxy does not produce a second prompt.
                    type: boolean
                  categoryChangedTmmEnabled:
                    description: |-
                      categoryChangedTmmEnabled moves a category's torrents in automatic
                      management when its save path changes. When off, they switch to manual
                      management.
                    type: boolean
                  dht:
                    description: dht enables the DHT (Distributed Hash Table) network.
                    type: boolean
                  dlLimit:
                    description: dlLimit is the global download speed limit in KiB/s.
                      0 means unlimited.
                    minimum: 0
                    type: integer
                  dontCountSlowTorrents:
                    description: dontCountSlowTorrents leaves slow torrents out of
                      the active limits.
                    type: boolean
                  encryption:
                    description: encryption controls the encryption mode. 0=prefer,
                      1=force on, 2=force off.
                    maximum: 2
                    minimum: 0
                    type: integer
                  excludedFileNames:
                    description: excludedFileNames are file name patterns to skip,
                      such as *.lnk.
                    items:
                      type: string
                    type: array
                  excludedFileNamesEnabled:
                    description: excludedFileNamesEnabled skips files whose names
                      match excludedFileNames.
                    type: boolean
                  incompleteFilesExt:
                    description: incompleteFilesExt adds .!qB to the names of files
                      still downloading.
                    type: boolean
                  limitLanPeers:
                    description: limitLanPeers applies the speed limits to peers on
                      the local network.
                    type: boolean
                  limitTcpOverhead:
                    description: limitTcpOverhead counts transport overhead against
                      the speed limits.
                    type: boolean
                  limitUtpRate:
                    description: limitUtpRate applies the speed limits to µTP connections.
                    type: boolean
                  listenPort:
                    description: listenPort is the port for incoming connections.
                    maximum: 65535
                    minimum: 1
                    type: integer
                  locale:
                    description: locale is the UI locale (e.g., "en").
                    type: string
                  lsd:
                    description: lsd enables Local Service Discovery.
                    type: boolean
                  maxActiveDownloads:
                    description: maxActiveDownloads is how many torrents can download
                      at once. -1 means unlimited.
                    type: integer
                  maxActiveTorrents:
                    description: maxActiveTorrents is how many torrents can be active
                      at once. -1 means unlimited.
                    type: integer
                  maxActiveUploads:
                    description: maxActiveUploads is how many torrents can seed at
                      once. -1 means unlimited.
                    type: integer
                  maxConnec:
                    description: maxConnec is the global maximum number of connections.
                      -1 means unlimited.
                    type: integer
                  maxConnecPerTorrent:
                    description: maxConnecPerTorrent is the maximum connections per
                      torrent. -1 means unlimited.
                    type: integer
                  maxInactiveSeedingTime:
                    description: maxInactiveSeedingTime is the global inactive seeding
                      time limit in minutes.
                    type: integer
                  maxInactiveSeedingTimeEnabled:
                    description: |-
                      maxInactiveSeedingTimeEnabled enables the global limit on seeding time
                      without uploads.
                    type: boolean
                  maxRatio:
                    description: |-
                      maxRatio is the global share ratio limit (e.g., "2.0").
                      Represented as a string to preserve decimal precision in JSON.
                    type: string
                  maxRatioAction:
                    description: maxRatioAction is what qBittorrent does when a share
                      limit is reached.
                    enum:
                    - stop
                    - remove
                    - enableSuperSeeding
                    - removeWithContent
                    type: string
                  maxRatioEnabled:
                    description: maxRatioEnabled enables the global share ratio limit.
                    type: boolean
                  maxSeedingTime:
                    description: maxSeedingTime is the global seeding time limit in
                      minutes.
                    type: integer
                  maxSeedingTimeEnabled:
                    description: maxSeedingTimeEnabled enables the global seeding
                      time limit.
                    type: boolean
                  maxUploads:
                    description: maxUploads is the global maximum number of upload
                      slots. -1 means unlimited.
                    type: integer
                  maxUploadsPerTorrent:
                    description: maxUploadsPerTorrent is the maximum upload slots
                      per torrent. -1 means unlimited.
                    type: integer
                  networkInterface:
                    description: |-
                      networkInterface binds connections to one network interface, such as a
                      VPN's tun0. Empty means any interface.
                    type: string
                  networkInterfaceAddress:
                    description: |-
                      networkInterfaceAddress binds connections to one address of
                      networkInterface. Empty means all of them.
                    type: string
                  pex:
                    description: pex enables Peer Exchange.
                    type: boolean
                  preallocateAll:
                    description: preallocateAll enables disk space pre-allocation
                      for all files.
                    type: boolean
                  queueingEnabled:
                    description: queueingEnabled limits how many torrents are active
                      at once.
                    type: boolean
                  randomPort:
                    description: randomPort picks a different listening port on each
                      start.
                    type: boolean
                  savePath:
                    description: savePath is the default save path for downloads.
                    type: string
                  savePathChangedTmmEnabled:
                    description: |-
                      savePathChangedTmmEnabled moves torrents in automatic management when
                      savePath changes. When off, they switch to manual management.
                    type: boolean
                  scheduleFromHour:
                    description: scheduleFromHour is the hour the alternative limits
                      start.
                    maximum: 23
                    minimum: 0
                    type: integer
                  scheduleFromMin:
                    description: scheduleFromMin is the minute the alternative limits
                      start.
                    maximum: 59
                    minimum: 0
                    type: integer
                  scheduleToHour:
                    description: scheduleToHour is the hour the alternative limits
                      end.
                    maximum: 23
                    minimum: 0
                    type: integer
                  scheduleToMin:
                    description: scheduleToMin is the minute the alternative limits
                      end.
                    maximum: 59
                    minimum: 0
                    type: integer
                  schedulerDays:
                    description: schedulerDays is the days the schedule runs.
                    enum:
                    - everyDay
                    - weekdays
                    - weekends
                    - monday
                    - tuesday
                    - wednesday
                    - thursday
                    - friday
                    - saturday
                    - sunday
                    type: string
                  schedulerEnabled:
                    description: schedulerEnabled turns the alternative limits on
                      and off on a schedule.
                    type: boolean
                  slowTorrentDlRateThreshold:
                    description: |-
                      slowTorrentDlRateThreshold is the download speed in KiB/s below which a
                      torrent counts as slow.
                    minimum: 0
                    type: integer
                  slowTorrentInactiveTimer:
                    description: |-
                      slowTorrentInactiveTimer is how many seconds a torrent stays under the
                      thresholds before it counts as slow.
                    minimum: 0
                    type: integer
                  slowTorrentUlRateThreshold:
                    description: |-
                      slowTorrentUlRateThreshold is the upload speed in KiB/s below which a
                      torrent counts as slow.
                    minimum: 0
                    type: integer
                  tempPath:
                    description: tempPath is where incomplete downloads go while tempPathEnabled
                      is on.
                    type: string
                  tempPathEnabled:
                    description: tempPathEnabled enables using a temporary path for
                      incomplete downloads.
                    type: boolean
                  torrentChangedTmmEnabled:
                    description: |-
                      torrentChangedTmmEnabled moves a torrent in automatic management when its
                      category changes. When off, the torrent switches to manual management.
                    type: boolean
                  torrentContentLayout:
                    description: |-
                      torrentContentLayout decides whether a torrent's files go in a folder of
                      their own.
                    enum:
                    - Original
                    - Subfolder
                    - NoSubfolder
                    type: string
                  torrentStopCondition:
                    description: torrentStopCondition stops a new torrent once it
                      gets this far.
                    enum:
                    - None
                    - MetadataReceived
                    - FilesChecked
                    type: string
                  upLimit:
                    description: upLimit is the global upload speed limit in KiB/s.
                      0 means unlimited.
                    minimum: 0
                    type: integer
                  upnp:
                    description: upnp forwards the listening port on the router with
                      UPnP or NAT-PMP.
                    type: boolean
                  webUiPort:
                    description: webUiPort is the Web UI listening port.
                    type: integer
                type: object
              reconcile:
                description: reconcile configures reconciliation behavior (e.g., sync
                  interval).
                properties:
                  deletionPolicy:
                    description: |-
                      deletionPolicy controls what happens to resources in the app when this CR
                      is deleted. "orphan" leaves them in place, "delete" removes the resources
                      the operator created.
                      Default: orphan.
                    enum:
                    - orphan
                    - delete
                    type: string
                  driftPolicy:
                    description: |-
                      driftPolicy controls whether drift is corrected or only recorded.
                      "enforce" rewrites a resource whose live state differs from this CR.
                      "observe" leaves the app untouched and only counts the difference, which
                      makes drift measurable before handing the operator write authority.
                      Default: enforce.
                    enum:
                    - enforce
                    - observe
                    type: string
                  interval:
                    description: |-
                      interval overrides the default reconciliation interval (default: 5m).
                      Uses standard Kubernetes duration format (e.g., "30s", "5m", "1h").
                    type: string
                  prune:
                    description: |-
                      prune deletes resources the operator created, tracked in
                      status.managedResources, once they are removed from this spec. Resources
                      it did not create are never deleted, and a resource type with nothing
                      declared is left alone. Root folders and tags are never pruned.
                      Not every integration supports prune; one that does not rejects it with
                      InvalidConfig rather than ignoring it.
                      Default: false (only create/update, never delete).
                    type: boolean
                type: object
            required:
            - connection
            type: object
          status:
            description: QBittorrentConfigStatus defines the observed state of QBittorrentConfig.
            properties:
              conditions:
                description: conditions represent the current state of the QBittorrentConfig
                  resource.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              lastSyncTime:
                description: lastSyncTime is the timestamp of the last successful
                  reconciliation.
                format: date-time
                type: string
              managedResources:
                additionalProperties:
                  items:
                    type: string
                  type: array
                description: |-
                  managedResources records the resources this operator created, keyed by
                  resource type. Prune only removes entries listed here, so resources
                  created outside the operator are never deleted.
                type: object
              observedGeneration:
                description: observedGeneration is the most recent generation observed.
                format: int64
                type: integer
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
