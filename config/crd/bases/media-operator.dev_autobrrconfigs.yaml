---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.23.0
  name: autobrrconfigs.media-operator.dev
spec:
  group: media-operator.dev
  names:
    kind: AutobrrConfig
    listKind: AutobrrConfigList
    plural: autobrrconfigs
    singular: autobrrconfig
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.conditions[?(@.type=="Synced")].status
      name: Synced
      type: string
    - jsonPath: .status.conditions[?(@.type=="Ready")].status
      name: Ready
      type: string
    - jsonPath: .status.lastSyncTime
      name: Last Sync
      type: date
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: AutobrrConfig is the Schema for the autobrrconfigs API.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: AutobrrConfigSpec defines the desired state of AutobrrConfig.
            properties:
              connection:
                description: connection defines how to connect to the Autobrr instance.
                properties:
                  apiKeySecretRef:
                    description: apiKeySecretRef references a Secret containing the
                      API key.
                    properties:
                      key:
                        description: key is the key within the Secret.
                        type: string
                      name:
                        description: name is the name of the Secret.
                        type: string
                    required:
                    - key
                    - name
                    type: object
                  tls:
                    description: |-
                      tls configures TLS settings for the connection.
                      Only needed when the app uses HTTPS with self-signed or private CA certificates.
                    properties:
                      caSecretRef:
                        description: |-
                          caSecretRef references a Secret containing a PEM-encoded CA certificate bundle
                          used to verify the target app's TLS certificate.
                          The Secret must contain the CA certificate under the specified key.
                        properties:
                          key:
                            description: key is the key within the Secret.
                            type: string
                          name:
                            description: name is the name of the Secret.
                            type: string
                        required:
                        - key
                        - name
                        type: object
                      insecureSkipVerify:
                        description: |-
                          insecureSkipVerify disables TLS certificate verification.
                          WARNING: This makes the connection susceptible to machine-in-the-middle attacks.
                          Only use for testing or when the target app uses a self-signed certificate and
                          providing a CA is not practical.
                        type: boolean
                    type: object
                  url:
                    description: url is the base URL of the app (e.g., http://arr-sonarr.arr.svc.cluster.local:8989).
                    type: string
                required:
                - apiKeySecretRef
                - url
                type: object
              downloadClients:
                description: downloadClients defines download client connections in
                  Autobrr.
                items:
                  description: AutobrrDownloadClient defines a download client connection
                    in Autobrr.
                  properties:
                    apiKeySecretRef:
                      description: |-
                        apiKeySecretRef references a Secret containing the API key, for Sonarr, Radarr, Lidarr,
                        Readarr and SABnzbd clients.
                      properties:
                        key:
                          description: key is the key within the Secret.
                          type: string
                        name:
                          description: name is the name of the Secret.
                          type: string
                      required:
                      - key
                      - name
                      type: object
                    enable:
                      default: true
                      description: enable controls whether this download client is
                        active.
                      type: boolean
                    host:
                      description: host is the hostname or URL of the download client.
                      type: string
                    name:
                      description: name is the display name of the download client.
                      type: string
                    passwordSecretRef:
                      description: passwordSecretRef references a Secret containing
                        the password.
                      properties:
                        key:
                          description: key is the key within the Secret.
                          type: string
                        name:
                          description: name is the name of the Secret.
                          type: string
                      required:
                      - key
                      - name
                      type: object
                    port:
                      description: port is the port of the download client.
                      type: integer
                    settings:
                      description: |-
                        settings is deprecated and rejected: Autobrr has no client-level category,
                        save path or content layout. Set category and savePath on filter actions.
                      properties:
                        category:
                          description: category is the default download category/label.
                          type: string
                        contentLayout:
                          description: contentLayout controls the content layout (Original,
                            Subfolder, NoSubfolder).
                          type: string
                        prioritizeProperRepacks:
                          description: prioritizeProperRepacks prioritizes proper/repack
                            releases.
                          type: boolean
                        savePath:
                          description: savePath overrides the default save path.
                          type: string
                      type: object
                    tls:
                      description: tls enables TLS for the connection.
                      type: boolean
                    type:
                      description: type is the download client type. Deluge means
                        Deluge 2 (Autobrr's DELUGE_V2).
                      enum:
                      - qBittorrent
                      - Deluge
                      - Transmission
                      - rTorrent
                      - SABnzbd
                      - Sonarr
                      - Radarr
                      - Lidarr
                      - Readarr
                      - Whisparr
                      type: string
                    usernameSecretRef:
                      description: usernameSecretRef references a Secret containing
                        the username.
                      properties:
                        key:
                          description: key is the key within the Secret.
                          type: string
                        name:
                          description: name is the name of the Secret.
                          type: string
                      required:
                      - key
                      - name
                      type: object
                  required:
                  - host
                  - name
                  - type
                  type: object
                type: array
              feeds:
                description: feeds defines RSS/Torznab feed sources.
                items:
                  description: AutobrrFeed defines an RSS or Torznab feed source.
                  properties:
                    apiKeySecretRef:
                      description: apiKeySecretRef references a Secret containing
                        the feed API key (for Torznab/Newznab).
                      properties:
                        key:
                          description: key is the key within the Secret.
                          type: string
                        name:
                          description: name is the name of the Secret.
                          type: string
                      required:
                      - key
                      - name
                      type: object
                    enable:
                      default: true
                      description: enable controls whether this feed is active.
                      type: boolean
                    indexerRef:
                      description: |-
                        indexerRef is the name of the indexer this feed belongs to: a torznab,
                        newznab or rss indexer declared under indexers.
                      type: string
                    interval:
                      default: 15
                      description: interval is the feed polling interval in minutes.
                      type: integer
                    name:
                      description: name is the display name of the feed.
                      type: string
                    type:
                      description: type is the feed type.
                      enum:
                      - RSS
                      - Torznab
                      - Newznab
                      type: string
                    url:
                      description: url is the feed URL.
                      type: string
                  required:
                  - indexerRef
                  - name
                  - type
                  - url
                  type: object
                type: array
              filters:
                description: filters defines release filters with match criteria and
                  actions.
                items:
                  description: AutobrrFilter defines a release filter with match criteria
                    and actions.
                  properties:
                    actions:
                      description: actions defines what to do when a release matches
                        this filter.
                      items:
                        description: AutobrrFilterAction defines an action to take
                          when a filter matches.
                        properties:
                          category:
                            description: category overrides the download client's
                              default category.
                            type: string
                          clientRef:
                            description: clientRef is the name of the download client
                              to use (must match a downloadClients entry).
                            type: string
                          contentLayout:
                            description: contentLayout decides whether the torrent's
                              files go in a folder of their own.
                            enum:
                            - ORIGINAL
                            - SUBFOLDER_CREATE
                            - SUBFOLDER_NONE
                            type: string
                          downloadPath:
                            description: downloadPath is where the download client
                              keeps the torrent while it downloads.
                            type: string
                          enable:
                            default: true
                            description: enable controls whether this action is active.
                            type: boolean
                          execArgs:
                            description: execArgs is the arguments for the exec command.
                            type: string
                          execCommand:
                            description: execCommand is the command to execute (for
                              Exec action type).
                            type: string
                          externalDownloadClient:
                            description: |-
                              externalDownloadClient is the download client, by name in Sonarr, Radarr, Lidarr or Readarr,
                              that the app sends the release to.
                            type: string
                          firstLastPiecePrio:
                            description: firstLastPiecePrio downloads the first and
                              last pieces first.
                            type: boolean
                          ignoreRules:
                            description: ignoreRules sends the release even when the
                              download client is past its limits.
                            type: boolean
                          label:
                            description: label is the label the download client gives
                              the torrent.
                            type: string
                          limitDownloadSpeed:
                            description: limitDownloadSpeed caps the torrent's download
                              speed, in KiB/s.
                            minimum: 0
                            type: integer
                          limitRatio:
                            description: limitRatio is the share ratio at which the
                              torrent stops seeding.
                            minimum: 0
                            type: number
                          limitSeedTime:
                            description: limitSeedTime is how many minutes the torrent
                              seeds.
                            minimum: 0
                            type: integer
                          limitUploadSpeed:
                            description: limitUploadSpeed caps the torrent's upload
                              speed, in KiB/s.
                            minimum: 0
                            type: integer
                          name:
                            description: name is the display name of the action.
                            type: string
                          paused:
                            description: paused adds the torrent paused.
                            type: boolean
                          priority:
                            description: priority is where the torrent goes in the
                              download client's queue.
                            enum:
                            - MAX
                            - MIN
                            - LOW
                            - NORMAL
                            - HIGH
                            type: string
                          reannounceDelete:
                            description: reannounceDelete removes the torrent if it
                              never announces.
                            type: boolean
                          reannounceInterval:
                            description: reannounceInterval is how many seconds to
                              wait between reannounce attempts.
                            minimum: 1
                            type: integer
                          reannounceMaxAttempts:
                            description: reannounceMaxAttempts is how many times to
                              reannounce.
                            minimum: 1
                            type: integer
                          reannounceSkip:
                            description: reannounceSkip adds the torrent without waiting
                              for it to announce.
                            type: boolean
                          savePath:
                            description: savePath overrides the download client's
                              default save path.
                            type: string
                          skipHashCheck:
                            description: skipHashCheck adds the torrent without checking
                              existing data.
                            type: boolean
                          tags:
                            description: tags is a comma-separated list of tags the
                              download client gives the torrent.
                            type: string
                          type:
                            description: type is the action type. Deluge means Deluge
                              2 (Autobrr's DELUGE_V2).
                            enum:
                            - qBittorrent
                            - Deluge
                            - Transmission
                            - rTorrent
                            - SABnzbd
                            - Sonarr
                            - Radarr
                            - Lidarr
                            - Readarr
                            - Whisparr
                            - Webhook
                            - Exec
                            - WatchFolder
                            type: string
                          watchFolder:
                            description: watchFolder is the folder path (for WatchFolder
                              action type).
                            type: string
                          webhookData:
                            description: webhookData is the body the webhook sends;
                              Autobrr fills in its macros.
                            type: string
                          webhookHeaders:
                            description: webhookHeaders are headers the webhook sends,
                              as Name=Value.
                            items:
                              type: string
                            type: array
                          webhookMethod:
                            description: webhookMethod is the HTTP method the webhook
                              uses.
                            enum:
                            - GET
                            - POST
                            - PUT
                            - PATCH
                            - DELETE
                            type: string
                          webhookType:
                            description: webhookType is the content type the webhook
                              sends, such as JSON.
                            type: string
                          webhookURL:
                            description: webhookURL is the webhook URL (for Webhook
                              action type).
                            type: string
                        required:
                        - name
                        - type
                        type: object
                      type: array
                    albums:
                      description: albums is a comma-separated list of albums to match.
                      type: string
                    announceTypes:
                      description: announceTypes is a list of announce types to match,
                        such as NEW or PROMO.
                      items:
                        type: string
                      type: array
                    artists:
                      description: artists is a comma-separated list of artists to
                        match.
                      type: string
                    codecs:
                      description: codecs is a list of acceptable codecs (e.g., "x264",
                        "x265", "HEVC").
                      items:
                        type: string
                      type: array
                    containers:
                      description: containers is a list of acceptable containers,
                        such as mkv.
                      items:
                        type: string
                      type: array
                    cue:
                      description: cue matches only releases with a cue file.
                      type: boolean
                    days:
                      description: days is a comma-separated list of days to match.
                      type: string
                    delay:
                      description: delay is the delay in seconds before grabbing a
                        matched release.
                      type: integer
                    enable:
                      default: true
                      description: enable controls whether this filter is active.
                      type: boolean
                    episodes:
                      description: episodes is a comma-separated list of episodes
                        or ranges to match.
                      type: string
                    exceptCategories:
                      description: exceptCategories is a comma-separated list of categories
                        to skip.
                      type: string
                    exceptDescription:
                      description: exceptDescription is a comma-separated list of
                        description patterns to skip.
                      type: string
                    exceptHdr:
                      description: exceptHdr is a list of HDR formats to skip.
                      items:
                        type: string
                      type: array
                    exceptLanguage:
                      description: exceptLanguage is a list of languages to skip.
                      items:
                        type: string
                      type: array
                    exceptOrigins:
                      description: exceptOrigins is a list of origins to skip.
                      items:
                        type: string
                      type: array
                    exceptOther:
                      description: exceptOther is a list of other release attributes
                        to skip.
                      items:
                        type: string
                      type: array
                    exceptReleaseGroups:
                      description: exceptReleaseGroups is a comma-separated list of
                        release groups to skip.
                      type: string
                    exceptReleaseTags:
                      description: exceptReleaseTags is a comma-separated list of
                        release tags to skip.
                      type: string
                    exceptReleaseTypes:
                      description: exceptReleaseTypes is a comma-separated list of
                        music release types to skip.
                      type: string
                    exceptReleases:
                      description: exceptReleases is a comma-separated list of release
                        name patterns to exclude.
                      type: string
                    exceptTags:
                      description: exceptTags is a list of tags to skip.
                      items:
                        type: string
                      type: array
                    exceptTagsMatchLogic:
                      description: exceptTagsMatchLogic decides whether any or all
                        of exceptTags skip a release.
                      enum:
                      - ANY
                      - ALL
                      type: string
                    exceptUploaders:
                      description: exceptUploaders is a comma-separated list of uploaders
                        to skip.
                      type: string
                    formats:
                      description: formats is a list of audio formats to match, such
                        as FLAC or MP3.
                      items:
                        type: string
                      type: array
                    freeleech:
                      description: freeleech matches only freeleech releases.
                      type: boolean
                    freeleechPercent:
                      description: freeleechPercent is the freeleech percentages to
                        match, such as 50%,75%-100%.
                      type: string
                    indexers:
                      description: |-
                        indexers lists the indexers, by name, whose releases this filter checks.
                        Autobrr checks a filter only against the indexers it lists.
                      items:
                        type: string
                      type: array
                    log:
                      description: log matches only releases with a rip log.
                      type: boolean
                    logScore:
                      description: logScore is the lowest rip log score to match.
                      maximum: 100
                      minimum: 0
                      type: integer
                    matchCategories:
                      description: matchCategories is a comma-separated list of categories
                        to match.
                      type: string
                    matchDescription:
                      description: matchDescription is a comma-separated list of description
                        patterns to match.
                      type: string
                    matchHdr:
                      description: matchHdr is a list of HDR formats to match, such
                        as DV or HDR10+.
                      items:
                        type: string
                      type: array
                    matchLanguage:
                      description: matchLanguage is a list of languages to match.
                      items:
                        type: string
                      type: array
                    matchOther:
                      description: matchOther is a list of other release attributes
                        to match, such as REMUX.
                      items:
                        type: string
                      type: array
                    matchReleaseGroups:
                      description: matchReleaseGroups is a comma-separated list of
                        release groups to match.
                      type: string
                    matchReleaseTags:
                      description: matchReleaseTags is a comma-separated list of release
                        tags to match.
                      type: string
                    matchReleaseTypes:
                      description: matchReleaseTypes is a list of music release types
                        to match, such as Album or EP.
                      items:
                        type: string
                      type: array
                    matchReleases:
                      description: matchReleases is a comma-separated list of release
                        name patterns to match (supports wildcards).
                      type: string
                    matchUploaders:
                      description: matchUploaders is a comma-separated list of uploaders
                        to match.
                      type: string
                    maxDownloads:
                      description: maxDownloads caps how many releases the filter
                        grabs per maxDownloadsUnit.
                      minimum: 0
                      type: integer
                    maxDownloadsUnit:
                      description: maxDownloadsUnit is the period maxDownloads counts
                        over.
                      enum:
                      - MINUTE
                      - HOUR
                      - DAY
                      - WEEK
                      - MONTH
                      - EVER
                      type: string
                    maxLeechers:
                      description: maxLeechers is the most leechers a release may
                        have.
                      minimum: 0
                      type: integer
                    maxSeeders:
                      description: maxSeeders is the most seeders a release may have.
                      minimum: 0
                      type: integer
                    maxSize:
                      description: maxSize is the maximum release size (e.g., "50GB").
                      type: string
                    media:
                      description: media is a list of music media to match, such as
                        CD or WEB.
                      items:
                        type: string
                      type: array
                    minLeechers:
                      description: minLeechers is the fewest leechers a release may
                        have.
                      minimum: 0
                      type: integer
                    minSeeders:
                      description: minSeeders is the fewest seeders a release may
                        have.
                      minimum: 0
                      type: integer
                    minSize:
                      description: minSize is the minimum release size (e.g., "100MB",
                        "1GB").
                      type: string
                    months:
                      description: months is a comma-separated list of months to match.
                      type: string
                    name:
                      description: name is the display name of the filter.
                      type: string
                    origins:
                      description: origins is a list of origins to match, such as
                        P2P, INTERNAL or SCENE.
                      items:
                        type: string
                      type: array
                    perfectFlac:
                      description: perfectFlac matches only lossless rips with a log
                        of 100 and a cue.
                      type: boolean
                    priority:
                      description: priority controls filter evaluation order. Lower
                        values are evaluated first.
                      type: integer
                    quality:
                      description: quality is a list of audio qualities to match,
                        such as Lossless or 320.
                      items:
                        type: string
                      type: array
                    resolutions:
                      description: resolutions is a list of acceptable resolutions.
                      items:
                        type: string
                      type: array
                    seasons:
                      description: seasons is a comma-separated list of seasons or
                        ranges to match, such as 1,3-5.
                      type: string
                    shows:
                      description: shows is a comma-separated list of shows to match.
                      type: string
                    smartEpisode:
                      description: smartEpisode skips episodes older than ones already
                        grabbed.
                      type: boolean
                    sources:
                      description: sources is a list of acceptable sources (e.g.,
                        "BluRay", "WEB-DL").
                      items:
                        type: string
                      type: array
                    tags:
                      description: tags is a list of tags for organizational purposes.
                      items:
                        type: string
                      type: array
                    tagsMatchLogic:
                      description: tagsMatchLogic decides whether a release needs
                        any or all of tags.
                      enum:
                      - ANY
                      - ALL
                      type: string
                    useRegex:
                      description: useRegex enables regex matching for release patterns.
                      type: boolean
                    useRegexDescription:
                      description: useRegexDescription reads the description patterns
                        as regular expressions.
                      type: boolean
                    useRegexReleaseTags:
                      description: useRegexReleaseTags reads the release tag patterns
                        as regular expressions.
                      type: boolean
                    years:
                      description: years is a comma-separated list of years or ranges
                        to match, such as 2018-2024.
                      type: string
                  required:
                  - name
                  type: object
                type: array
              indexers:
                description: indexers defines indexer/tracker connections.
                items:
                  description: AutobrrIndexer defines an indexer/tracker connection
                    in Autobrr.
                  properties:
                    baseURL:
                      description: baseURL is the tracker's site URL. It defaults
                        to the definition's first URL.
                      type: string
                    enable:
                      default: true
                      description: enable controls whether this indexer is active.
                      type: boolean
                    identifier:
                      description: |-
                        identifier is the Autobrr indexer definition, such as "ipt" or "btn", or
                        "torznab", "newznab" or "rss" for an indexer that a feed reads from.
                      type: string
                    name:
                      description: name is the display name of the indexer.
                      type: string
                    settings:
                      description: settings are the definition's settings, such as
                        passkey or rsskey.
                      items:
                        description: ConfigField represents a key-value field in a
                          download client configuration.
                        properties:
                          name:
                            description: name is the field name.
                            type: string
                          value:
                            description: value is the field value. Can be a string,
                              number, or boolean.
                            x-kubernetes-preserve-unknown-fields: true
                          valueFrom:
                            description: valueFrom sources the field value from a
                              Secret. Mutually exclusive with value.
                            properties:
                              key:
                                description: key is the key within the Secret.
                                type: string
                              name:
                                description: name is the name of the Secret.
                                type: string
                            required:
                            - key
                            - name
                            type: object
                        required:
                        - name
                        type: object
                      type: array
                  required:
                  - identifier
                  - name
                  type: object
                type: array
              ircNetworks:
                description: ircNetworks defines IRC network connections for announce
                  channel monitoring.
                items:
                  description: AutobrrIRCNetwork defines an IRC network connection
                    for announce monitoring.
                  properties:
                    authAccountSecretRef:
                      description: authAccountSecretRef references a Secret containing
                        the auth account name.
                      properties:
                        key:
                          description: key is the key within the Secret.
                          type: string
                        name:
                          description: name is the name of the Secret.
                          type: string
                      required:
                      - key
                      - name
                      type: object
                    authMechanism:
                      default: None
                      description: authMechanism is the authentication mechanism (SASL_PLAIN,
                        NickServ, None).
                      enum:
                      - SASL_PLAIN
                      - NickServ
                      - None
                      type: string
                    authPasswordSecretRef:
                      description: authPasswordSecretRef references a Secret containing
                        the auth password.
                      properties:
                        key:
                          description: key is the key within the Secret.
                          type: string
                        name:
                          description: name is the name of the Secret.
                          type: string
                      required:
                      - key
                      - name
                      type: object
                    channels:
                      description: channels defines the IRC channels to join.
                      items:
                        description: AutobrrIRCChannel defines an IRC channel to monitor.
                        properties:
                          name:
                            description: name is the channel name (e.g., "#announce").
                            type: string
                          passwordSecretRef:
                            description: passwordSecretRef references a Secret containing
                              the channel password/key.
                            properties:
                              key:
                                description: key is the key within the Secret.
                                type: string
                              name:
                                description: name is the name of the Secret.
                                type: string
                            required:
                            - key
                            - name
                            type: object
                        required:
                        - name
                        type: object
                      type: array
                    enable:
                      default: true
                      description: enable controls whether this IRC network connection
                        is active.
                      type: boolean
                    inviteCommand:
                      description: inviteCommand is the IRC command to send to request
                        channel invites.
                      type: string
                    name:
                      description: name is the display name of the IRC network.
                      type: string
                    nick:
                      description: nick is the IRC nickname to use.
                      type: string
                    port:
                      description: port is the IRC server port.
                      type: integer
                    server:
                      description: server is the IRC server address (e.g., "irc.example.com").
                      type: string
                    tls:
                      description: tls enables TLS for the IRC connection.
                      type: boolean
                  required:
                  - name
                  - nick
                  - port
                  - server
                  type: object
                type: array
              reconcile:
                description: reconcile configures reconciliation behavior (e.g., sync
                  interval).
                properties:
                  deletionPolicy:
                    description: |-
                      deletionPolicy controls what happens to resources in the app when this CR
                      is deleted. "orphan" leaves them in place, "delete" removes the resources
                      the operator created.
                      Default: orphan.
                    enum:
                    - orphan
                    - delete
                    type: string
                  driftPolicy:
                    description: |-
                      driftPolicy controls whether drift is corrected or only recorded.
                      "enforce" rewrites a resource whose live state differs from this CR.
                      "observe" leaves the app untouched and only counts the difference, which
                      makes drift measurable before handing the operator write authority.
                      Default: enforce.
                    enum:
                    - enforce
                    - observe
                    type: string
                  interval:
                    description: |-
