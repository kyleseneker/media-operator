apiVersion: media-operator.dev/v1alpha1
kind: TdarrConfig
metadata:
  name: tdarr
  namespace: arr
spec:
  connection:
    url: http://arr-tdarr.arr.svc.cluster.local:8266
    apiKeySecretRef:
      name: arr-config-secrets
      key: TDARR_API_KEY
  workers:
    nodeName: InternalNode
    transcodeGPU: 1
    transcodeCPU: 0
    healthcheckGPU: 1
    healthcheckCPU: 1
  libraries:
    - id: library-tv
      name: TV Shows
      folder: /data/media/tv
      cache: /temp
      container: ".mkv"
      containerFilter: "mkv,mp4,mov,m4v,mpg,mpeg,avi,flv,webm,wmv,vob,evo,m2ts,ts"
      folderWatching: true
      processLibrary: true
      scanOnStart: true
      scheduledScanFindNew: true
      scannerThreadCount: 2
      ffmpeg: true
    - id: library-movies
      name: Movies
      folder: /data/media/movies
      cache: /temp
      container: ".mkv"
      containerFilter: "mkv,mp4,mov,m4v,mpg,mpeg,avi,flv,webm,wmv,vob,evo,m2ts,ts"
      folderWatching: true
      processLibrary: true
      scanOnStart: true
      scheduledScanFindNew: true
      scannerThreadCount: 2
      ffmpeg: true
      decisionMode: flows
      flowId: mkv-check
  flows:
    - id: mkv-check
      name: MKV check
      description: Checks the container and stops
      # Paste flowPlugins and flowEdges from Tdarr's flow export. Quote "y":
      # YAML 1.1 parsers, kubectl's included, read a bare y as true.
      flowPlugins:
        - id: inputNode
          name: Input File
          sourceRepo: Community
          pluginName: inputFile
          version: 1.0.0
          inputsDB:
            fileAccessChecks: "true"
          position:
            x: 0
            "y": 0
          fpEnabled: true
        - id: checkNode
          name: Check if mkv
          sourceRepo: Community
          pluginName: checkFileExtension
          version: 1.0.0
          inputsDB:
            extensions: mkv
          position:
            x: 0
            "y": 200
          fpEnabled: true
      flowEdges:
        - id: inputToCheck
          source: inputNode
          sourceHandle: "1"
          target: checkNode
          targetHandle: null
