apiVersion: media-operator.dev/v1alpha1
kind: MaintainerrConfig
metadata:
  name: maintainerr
  namespace: media
  labels:
    app.kubernetes.io/name: media-operator
    app.kubernetes.io/managed-by: kustomize
spec:
  # Maintainerr has no API authentication; keep it off untrusted networks.
  connection:
    url: http://maintainerr:6246
  # Set on a fresh Maintainerr only. Switching an existing one between Plex and
  # Jellyfin deletes every collection, so the operator reports it instead.
  mediaServer:
    plex:
      hostname: plex.media.svc.cluster.local
      port: 32400
      ssl: false
      tokenSecretRef:
        name: plex-secrets
        key: token
  sonarr:
    - name: Sonarr
      url: http://sonarr:8989
      apiKeySecretRef:
        name: sonarr-secrets
        key: api-key
      tagExclusions: true
      exclusionTag: keep
      untagOnUnexclude: true
  radarr:
    - name: Radarr
      url: http://radarr:7878
      apiKeySecretRef:
        name: radarr-secrets
        key: api-key
  seerr:
    url: http://seerr:5055
    apiKeySecretRef:
      name: seerr-secrets
      key: api-key
  tautulli:
    url: http://tautulli:8181
    apiKeySecretRef:
      name: tautulli-secrets
      key: api-key
  jobs:
    rules: "0 0-23/8 * * *"
    collections: "0 0-23/12 * * *"
  ruleGroups:
    # Properties and comparisons use the names in Maintainerr's rule YAML export.
    - name: Stale unwatched movies
      description: Added over 180 days ago and never watched
      library: Movies
      active: true
      arrAction: unmonitorDeleteAll
      actionAfterDays: 30
      radarrServer: Radarr
      listExclusions: true
      cleanupLeftoverFolders: true
      forceSeerr: true
      tagInArr: false
      keepInMaintainerrOnly: false
      visibleOnHome: true
      visibleOnRecommended: false
      schedule: "0 3 * * *"
      sections:
        - rules:
            - firstValue: Plex.addDate
              action: BEFORE
              customValue:
                type: custom_days
                value: 180
            - operator: AND
              firstValue: Plex.viewCount
              action: EQUALS
              customValue:
                type: number
                value: 0
        - operator: OR
          rules:
            - firstValue: Radarr.monitored
              action: EQUALS
              customValue:
                type: boolean
                value: "false"
    - name: Watched seasons to SD
      library: TV Shows
      dataType: season
      arrAction: changeQualityProfile
      sonarrServer: Sonarr
      qualityProfile: SD
      sections:
        - rules:
            - firstValue: Tautulli.sw_allEpisodesSeenBy
              action: CONTAINS
              customValue:
                type: text
                value: alice
            - operator: AND
              firstValue: Sonarr.diskSizeEntireShow
              action: BIGGER
              arrDiskPath: /data/media/tv
              customValue:
                type: number
                value: 50
            - operator: AND
              firstValue: Tautulli.viewCountByUser
              action: BIGGER
              username: alice
              customValue:
                type: number
                value: 0
            - operator: AND
              firstValue: Plex.lastViewedAt
              action: BEFORE
              lastValue: Plex.addDate
