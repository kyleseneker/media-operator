dockers_v2:
  - id: media-operator-pvr
    ids: [media-operator-pvr]
    images: [ghcr.io/kyleseneker/media-operator-pvr]
    tags: ["{{ .Version }}", latest]
    platforms: [linux/amd64, linux/arm64]
    sbom: "{{ not .IsSnapshot }}"
    build_args:
      BINARY: media-operator-pvr
    annotations: &image-annotations
      "index,manifest:org.opencontainers.image.source": https://github.com/kyleseneker/media-operator
      "index,manifest:org.opencontainers.image.revision": "{{ .FullCommit }}"
      "index,manifest:org.opencontainers.image.version": "{{ .Version }}"
      "index,manifest:org.opencontainers.image.created": "{{ .Date }}"
      "index,manifest:org.opencontainers.image.licenses": Apache-2.0
      "index,manifest:org.opencontainers.image.base.name": "{{ .BaseImage }}"
      "index,manifest:org.opencontainers.image.base.digest": "{{ .BaseImageDigest }}"
      "index,manifest:org.opencontainers.image.description": Manages Sonarr, Radarr, Lidarr and Readarr configuration as Kubernetes resources
  - id: media-operator-indexers
    ids: [media-operator-indexers]
    images: [ghcr.io/kyleseneker/media-operator-indexers]
    tags: ["{{ .Version }}", latest]
    platforms: [linux/amd64, linux/arm64]
