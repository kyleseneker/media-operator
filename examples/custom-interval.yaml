# Example: per-resource reconcile interval and pruning.
# Useful when some apps change config more often than others,
# or when you want to reduce API calls to a slow/overloaded app.
#
# prune: true deletes resources the operator created once you remove them from the CR.
# For example, remove a download client the operator added and it is deleted from the app.
# Anything created by hand is never deleted, root folders and tags are never pruned, and
# omitting a section entirely means "don't manage this." Operators that cannot prune
# reject prune: true with InvalidConfig; see docs/guide.md for which ones can.
---
apiVersion: media-operator.dev/v1alpha1
kind: SonarrConfig
metadata:
  name: sonarr
  namespace: media
spec:
  connection:
    url: http://sonarr:8989
    apiKeySecretRef:
      name: sonarr-credentials
      key: api-key
  # Check every 10 minutes instead of the default 5, enable pruning
  reconcile:
    interval: 10m
    prune: true
  rootFolders:
    - path: /media/tv
---
apiVersion: media-operator.dev/v1alpha1
kind: JellyfinConfig
metadata:
  name: jellyfin
  namespace: media
spec:
  connection:
    url: http://jellyfin:8096
  adminUser:
    usernameSecretRef:
      name: jellyfin-credentials
      key: username
    passwordSecretRef:
      name: jellyfin-credentials
      key: password
  # Jellyfin config rarely changes, check every 30 minutes
  reconcile:
    interval: 30m
  server:
    serverName: "Homelab Media"
  libraries:
    - name: Movies
      collectionType: movies
      paths:
        - /media/movies
