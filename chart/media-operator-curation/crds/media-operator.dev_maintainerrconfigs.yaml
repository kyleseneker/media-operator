---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.23.0
  name: maintainerrconfigs.media-operator.dev
spec:
  group: media-operator.dev
  names:
    kind: MaintainerrConfig
    listKind: MaintainerrConfigList
    plural: maintainerrconfigs
    singular: maintainerrconfig
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.conditions[?(@.type=="Synced")].status
      name: Synced
      type: string
    - jsonPath: .status.conditions[?(@.type=="Ready")].status
      name: Ready
      type: string
    - jsonPath: .status.lastSyncTime
      name: Last Sync
      type: date
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: MaintainerrConfig is the Schema for the maintainerrconfigs API.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: MaintainerrConfigSpec defines the desired state of MaintainerrConfig.
            properties:
              connection:
                description: connection defines how to connect to the Maintainerr
                  instance.
                properties:
                  tls:
                    description: |-
                      tls configures TLS settings for the connection.
                      Only needed when Maintainerr uses HTTPS with self-signed or private CA certificates.
                    properties:
                      caSecretRef:
                        description: |-
                          caSecretRef references a Secret containing a PEM-encoded CA certificate bundle
                          used to verify the target app's TLS certificate.
                          The Secret must contain the CA certificate under the specified key.
                        properties:
                          key:
                            description: key is the key within the Secret.
                            type: string
                          name:
                            description: name is the name of the Secret.
                            type: string
                        required:
                        - key
                        - name
                        type: object
                      insecureSkipVerify:
                        description: |-
                          insecureSkipVerify disables TLS certificate verification.
                          WARNING: This makes the connection susceptible to machine-in-the-middle attacks.
                          Only use for testing or when the target app uses a self-signed certificate and
                          providing a CA is not practical.
                        type: boolean
                    type: object
                  url:
                    description: |-
                      url is the base URL of Maintainerr, including any BASE_PATH
                      (e.g., http://maintainerr:6246).
                    type: string
                required:
                - url
                type: object
              jobs:
                description: jobs sets when Maintainerr runs its rules and acts on
                  its collections.
                properties:
                  collections:
                    description: |-
                      collections is when Maintainerr acts on media whose time in a collection
                      has run out (e.g., "0 0-23/12 * * *").
                    type: string
                  rules:
                    description: rules is when Maintainerr evaluates rule groups (e.g.,
                      "0 0-23/8 * * *").
                    type: string
                type: object
              mediaServer:
                description: |-
                  mediaServer connects Maintainerr to Plex or Jellyfin. The operator sets the
                  media server on a fresh Maintainerr only: switching an existing one deletes
                  every collection, so a different server already in use is reported as an
                  error instead.
                properties:
                  jellyfin:
                    description: |-
                      jellyfin connects Maintainerr to a Jellyfin server. Maintainerr tests the
                      connection before saving it, so Jellyfin must be reachable from Maintainerr.
                    properties:
                      apiKeySecretRef:
                        description: apiKeySecretRef references a Secret containing
                          a Jellyfin API key.
                        properties:
                          key:
                            description: key is the key within the Secret.
                            type: string
                          name:
                            description: name is the name of the Secret.
                            type: string
                        required:
                        - key
                        - name
                        type: object
                      url:
                        description: url is the Jellyfin URL as Maintainerr reaches
                          it (e.g., http://jellyfin:8096).
                        pattern: ^https?://
                        type: string
                      userId:
                        description: |-
                          userId is the Jellyfin administrator Maintainerr acts as. Maintainerr
                          picks the first administrator when it is unset.
                        type: string
                    required:
                    - apiKeySecretRef
                    - url
                    type: object
                  plex:
                    description: plex connects Maintainerr to a Plex server.
                    properties:
                      hostname:
                        description: |-
                          hostname is the Plex host as Maintainerr reaches it, without a scheme
                          (e.g., plex.media.svc.cluster.local).
                        minLength: 1
                        type: string
                      port:
                        default: 32400
                        description: port is the Plex port.
                        format: int32
                        maximum: 65535
                        minimum: 1
                        type: integer
                      ssl:
                        description: ssl connects to Plex over HTTPS.
                        type: boolean
                      tokenSecretRef:
                        description: |-
                          tokenSecretRef references a Secret containing a Plex token for an account
                          with access to the server.
                        properties:
                          key:
                            description: key is the key within the Secret.
                            type: string
                          name:
                            description: name is the name of the Secret.
                            type: string
                        required:
                        - key
                        - name
                        type: object
                    required:
                    - hostname
                    - tokenSecretRef
                    type: object
                type: object
                x-kubernetes-validations:
                - message: set exactly one of plex or jellyfin
                  rule: has(self.plex) != has(self.jellyfin)
              notifications:
                description: |-
                  notifications defines where Maintainerr sends notifications, matched by
                  name. A notification reports only on the rule groups that name it.
                items:
                  description: MaintainerrNotification is one place Maintainerr sends
                    notifications to.
                  properties:
                    aboutScale:
                      description: |-
                        aboutScale is how many days before media is handled mediaAboutToBeHandled
                        is sent.
                      format: int32
                      minimum: 1
                      type: integer
                    agent:
                      description: agent is the service notifications go to.
                      enum:
                      - discord
                      - email
                      - gotify
                      - ntfy
                      - pushbullet
                      - pushover
                      - slack
                      - telegram
                      - webhook
                      - lunasea
                      type: string
                    enabled:
                      description: enabled turns the notification on. A new one is
                        on unless this says otherwise.
                      type: boolean
                    name:
                      description: name identifies the notification.
                      minLength: 1
                      type: string
                    options:
                      additionalProperties:
                        description: FieldValue wraps a value that can be a string,
                          int, or bool.
                        x-kubernetes-preserve-unknown-fields: true
                      description: |-
                        options sets the agent's settings, such as botUsername, chatId or
                        jsonPayload. Values keep their type.
                      type: object
                    secretOptions:
                      additionalProperties:
                        description: SecretKeyRef references a key within a Kubernetes
                          Secret.
                        properties:
                          key:
                            description: key is the key within the Secret.
                            type: string
                          name:
                            description: name is the name of the Secret.
                            type: string
                        required:
                        - key
                        - name
                        type: object
                      description: |-
                        secretOptions sets agent settings from Secrets, by setting name, such as
                        webhookUrl, botAuthToken or authPass. They take precedence over options.
                      type: object
                    types:
                      description: types are the events that send a notification.
                      items:
                        enum:
                        - mediaAddedToCollection
                        - mediaRemovedFromCollection
                        - mediaAboutToBeHandled
                        - mediaHandled
                        - ruleHandlingFailed
                        - collectionHandlingFailed
                        - overlayApplied
                        - overlayReverted
                        - updateAvailable
                        type: string
                      type: array
                  required:
                  - agent
                  - name
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - name
                x-kubernetes-list-type: map
              radarr:
                description: radarr lists the Radarr servers rule groups can act through.
                items:
                  description: MaintainerrArrServer is a Sonarr or Radarr server in
                    Maintainerr.
                  properties:
                    apiKeySecretRef:
                      description: apiKeySecretRef references a Secret containing
                        the server's API key.
                      properties:
                        key:
                          description: key is the key within the Secret.
                          type: string
                        name:
                          description: name is the name of the Secret.
                          type: string
                      required:
                      - key
                      - name
                      type: object
                    exclusionTag:
                      description: |-
                        exclusionTag is the tag tagExclusions looks for. Maintainerr uses "dnd"
                        when it is unset.
                      pattern: ^[a-z0-9-]+$
                      type: string
                    name:
                      description: |-
                        name identifies the server here and in ruleGroups[].sonarrServer and
                        ruleGroups[].radarrServer. It is the server name Maintainerr shows.
                      minLength: 1
                      type: string
                    tagExclusions:
                      description: |-
                        tagExclusions excludes media carrying exclusionTag in this server from
                        every rule group.
                      type: boolean
                    untagOnUnexclude:
                      description: |-
                        untagOnUnexclude removes exclusionTag from media when it is no longer
                        excluded in Maintainerr.
                      type: boolean
                    url:
                      description: url is the server URL as Maintainerr reaches it
                        (e.g., http://radarr:7878).
                      pattern: ^https?://
                      type: string
                  required:
                  - apiKeySecretRef
                  - name
                  - url
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - name
                x-kubernetes-list-type: map
              reconcile:
                description: reconcile configures reconciliation behavior (e.g., sync
                  interval).
                properties:
                  deletionPolicy:
                    description: |-
                      deletionPolicy controls what happens to resources in the app when this CR
                      is deleted. "orphan" leaves them in place, "delete" removes the resources
                      the operator created.
                      Default: orphan.
                    enum:
                    - orphan
                    - delete
                    type: string
                  driftPolicy:
                    description: |-
                      driftPolicy controls whether drift is corrected or only recorded.
                      "enforce" rewrites a resource whose live state differs from this CR.
                      "observe" leaves the app untouched and only counts the difference, which
                      makes drift measurable before handing the operator write authority.
                      Default: enforce.
                    enum:
                    - enforce
                    - observe
                    type: string
                  interval:
                    description: |-
                      interval overrides the default reconciliation interval (default: 5m).
                      Uses standard Kubernetes duration format (e.g., "30s", "5m", "1h").
                    type: string
                  prune:
                    description: |-
                      prune deletes resources the operator created, tracked in
                      status.managedResources, once they are removed from this spec. Resources
                      it did not create are never deleted, and a resource type with nothing
                      declared is left alone. Root folders and tags are never pruned.
                      Not every integration supports prune; one that does not rejects it with
                      InvalidConfig rather than ignoring it.
                      Default: false (only create/update, never delete).
                    type: boolean
                type: object
              ruleGroups:
                description: |-
                  ruleGroups are the rules that put media into a collection and the action
                  Maintainerr takes on it. Each group is matched by name.
                items:
                  description: |-
                    MaintainerrRuleGroup is a set of rules, the collection the matching media goes
                    into and what Maintainerr does with it.
                  properties:
                    actionAfterDays:
                      description: |-
                        actionAfterDays is how long media stays in the collection before arrAction
                        runs. A new group without it fills its collection but never acts. Removing
                        it later leaves Maintainerr's value in place: Maintainerr cannot clear it.
                      format: int32
                      maximum: 36500
                      minimum: 0
                      type: integer
                    active:
                      default: true
                      description: |-
                        active runs the rule group. Inactive groups keep their collection but are
                        not evaluated or acted on.
                      type: boolean
                    arrAction:
                      description: |-
                        arrAction is what Maintainerr does with media once actionAfterDays have
                        passed. Without a Sonarr or Radarr server, deleting actions delete through
                        the media server. changeQualityProfile needs qualityProfile.
                      enum:
                      - delete
                      - unmonitorDeleteAll
                      - unmonitorDeleteExisting
                      - unmonitor
                      - doNothing
                      - deleteShowIfEmpty
                      - unmonitorShowIfEmpty
                      - changeQualityProfile
                      type: string
                    cleanupLeftoverFolders:
                      description: |-
                        cleanupLeftoverFolders deletes folders a deleting action leaves behind.
                        Maintainerr supports it for unmonitorDeleteAll on movies and shows,
                        unmonitorDeleteExisting on shows and seasons, and delete or
                        deleteShowIfEmpty on seasons.
                      type: boolean
                    dataType:
                      description: |-
                        dataType is what a show library's rules match: whole shows, seasons or
                        episodes. Movie libraries always match movies. Changing it empties the
                        collection.
                      enum:
                      - movie
                      - show
                      - season
                      - episode
                      type: string
                    description:
                      description: description is shown on the collection.
                      type: string
                    forceSeerr:
                      description: |-
                        forceSeerr removes the media's requests from Seerr when it is acted on,
                        even if Seerr is not otherwise involved. Not supported for episodes.
                      type: boolean
                    keepInMaintainerrOnly:
                      description: |-
                        keepInMaintainerrOnly keeps the collection in Maintainerr without creating
                        it on the media server.
                      type: boolean
                    library:
                      description: library is the title of the media server library
                        the rules run against.
                      minLength: 1
                      type: string
                    listExclusions:
                      description: |-
                        listExclusions adds deleted media to the Sonarr or Radarr import list
                        exclusions, so lists do not add it again.
                      type: boolean
                    name:
                      description: name identifies the rule group and names its collection.
                      minLength: 1
                      type: string
                    notifications:
                      description: |-
                        notifications names the spec.notifications, or notifications made in
                        Maintainerr, that report on this group. Unset, the group keeps the ones
                        it has.
                      items:
                        type: string
                      type: array
                    qualityProfile:
                      description: |-
                        qualityProfile is the name of the Sonarr or Radarr quality profile that
                        changeQualityProfile switches media to.
                      type: string
                    radarrServer:
                      description: |-
                        radarrServer names the spec.radarr server to act through. Required when a
                        rule reads Radarr.
                      type: string
                    schedule:
                      description: |-
                        schedule is a cron expression for this group's rule runs. Unset, the group
                        runs on spec.jobs.rules.
                      type: string
                    sections:
                      description: |-
                        sections are evaluated in order. Rules within a section combine with each
                        other first; each section then combines with the result of the ones before
                        it.
                      items:
                        description: MaintainerrRuleSection is a group of rules evaluated
                          together.
                        properties:
                          operator:
                            description: |-
                              operator combines this section with the sections before it. Required on
                              every section but the first, and not allowed on the first.
                            enum:
                            - AND
                            - OR
                            type: string
                          rules:
                            description: rules are combined in order, each with the
                              result of the ones before it.
                            items:
                              description: |-
                                MaintainerrRule compares a property of the media with a value or with another
                                property. It uses the names Maintainerr's rule YAML export uses.
                              properties:
                                action:
                                  description: action is the comparison.
                                  enum:
                                  - BIGGER
                                  - SMALLER
                                  - EQUALS
                                  - NOT_EQUALS
                                  - CONTAINS
                                  - BEFORE
                                  - AFTER
                                  - IN_LAST
                                  - IN_NEXT
                                  - NOT_CONTAINS
                                  - CONTAINS_PARTIAL
                                  - NOT_CONTAINS_PARTIAL
                                  - CONTAINS_ALL
                                  - NOT_CONTAINS_ALL
                                  - COUNT_EQUALS
                                  - COUNT_NOT_EQUALS
                                  - COUNT_BIGGER
                                  - COUNT_SMALLER
                                  - EXISTS
                                  - NOT_EXISTS
                                  type: string
                                arrDiskPath:
                                  description: arrDiskPath limits disk-space properties
                                    to one Sonarr or Radarr root folder.
                                  type: string
                                customValue:
                                  description: customValue is a literal value to compare
                                    against.
                                  properties:
                                    type:
                                      description: |-
                                        type is how value is read. custom_days is a number of days, which date
                                        properties compare relative to now. date takes an ISO date. boolean takes
                                        "true" or "false". text_list takes a JSON array or a single value.
                                      enum:
                                      - number
                                      - custom_days
                                      - date
                                      - text
                                      - text_list
                                      - boolean
                                      type: string
                                    value:
                                      anyOf:
                                      - type: integer
                                      - type: string
                                      description: 'value is the literal. Quote booleans:
                                        value: "true".'
                                      x-kubernetes-int-or-string: true
                                  required:
                                  - type
                                  - value
                                  type: object
                                firstValue:
                                  description: |-
                                    firstValue is the property compared, as Application.property (e.g.,
                                    Plex.addDate, Jellyfin.viewCount, Radarr.fileSize). Plex and Jellyfin
                                    properties must belong to the configured media server. A name Maintainerr
                                    lists twice resolves to the one not marked deprecated.
                                  pattern: ^[A-Za-z]+\.[A-Za-z0-9_]+$
                                  type: string
                                lastValue:
                                  description: |-
                                    lastValue is a second property to compare against, as Application.property.
                                    Set lastValue or customValue, not both.
                                  pattern: ^[A-Za-z]+\.[A-Za-z0-9_]+$
                                  type: string
                                operator:
                                  description: |-
                                    operator combines this rule with the rules before it in the section.
                                    Required on every rule but a section's first, and not allowed on the first.
                                  enum:
                                  - AND
                                  - OR
                                  type: string
                                username:
                                  description: |-
                                    username is the media server user that per-user properties (viewCountByUser,
                                    watchTimeByUser, lastViewedAtByUser) are read for. Required by those
                                    properties and not allowed on others.
                                  type: string
                              required:
                              - action
                              - firstValue
                              type: object
                            minItems: 1
                            type: array
                        required:
                        - rules
                        type: object
                      minItems: 1
                      type: array
                    sonarrServer:
                      description: |-
                        sonarrServer names the spec.sonarr server to act through. Required when a
                        rule reads Sonarr.
                      type: string
                    tagInArr:
                      description: tagInArr tags collection members in Sonarr or Radarr.
                      type: boolean
                    visibleOnHome:
                      description: visibleOnHome shows the collection on the media
                        server's home screen.
                      type: boolean
                    visibleOnRecommended:
                      description: visibleOnRecommended shows the collection in the
                        library's recommendations.
                      type: boolean
                  required:
                  - arrAction
                  - library
                  - name
                  - sections
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - name
                x-kubernetes-list-type: map
              seerr:
                description: |-
                  seerr connects Maintainerr to Seerr (or Overseerr or Jellyseerr), which
                  rules can read and which Maintainerr clears requests in.
                properties:
                  apiKeySecretRef:
                    description: apiKeySecretRef references a Secret containing the
                      service's API key.
                    properties:
                      key:
                        description: key is the key within the Secret.
                        type: string
                      name:
                        description: name is the name of the Secret.
                        type: string
                    required:
                    - key
                    - name
                    type: object
                  url:
                    description: url is the service URL as Maintainerr reaches it.
                    pattern: ^https?://
                    type: string
                required:
                - apiKeySecretRef
                - url
                type: object
              sonarr:
                description: sonarr lists the Sonarr servers rule groups can act through.
                items:
                  description: MaintainerrArrServer is a Sonarr or Radarr server in
                    Maintainerr.
                  properties:
                    apiKeySecretRef:
                      description: apiKeySecretRef references a Secret containing
                        the server's API key.
                      properties:
                        key:
                          description: key is the key within the Secret.
                          type: string
                        name:
                          description: name is the name of the Secret.
                          type: string
                      required:
                      - key
                      - name
                      type: object
                    exclusionTag:
                      description: |-
                        exclusionTag is the tag tagExclusions looks for. Maintainerr uses "dnd"
                        when it is unset.
                      pattern: ^[a-z0-9-]+$
                      type: string
                    name:
                      description: |-
                        name identifies the server here and in ruleGroups[].sonarrServer and
                        ruleGroups[].radarrServer. It is the server name Maintainerr shows.
                      minLength: 1
                      type: string
                    tagExclusions:
                      description: |-
                        tagExclusions excludes media carrying exclusionTag in this server from
                        every rule group.
                      type: boolean
                    untagOnUnexclude:
                      description: |-
                        untagOnUnexclude removes exclusionTag from media when it is no longer
                        excluded in Maintainerr.
                      type: boolean
                    url:
                      description: url is the server URL as Maintainerr reaches it
                        (e.g., http://radarr:7878).
                      pattern: ^https?://
                      type: string
                  required:
                  - apiKeySecretRef
                  - name
                  - url
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - name
                x-kubernetes-list-type: map
              tautulli:
                description: |-
                  tautulli connects Maintainerr to Tautulli. Rules can read it only when
                  Plex is the media server.
                properties:
                  apiKeySecretRef:
                    description: apiKeySecretRef references a Secret containing the
                      service's API key.
                    properties:
                      key:
                        description: key is the key within the Secret.
                        type: string
                      name:
                        description: name is the name of the Secret.
                        type: string
                    required:
                    - key
                    - name
                    type: object
                  url:
                    description: url is the service URL as Maintainerr reaches it.
                    pattern: ^https?://
                    type: string
                required:
                - apiKeySecretRef
                - url
                type: object
            required:
            - connection
            type: object
          status:
            description: MaintainerrConfigStatus defines the observed state of MaintainerrConfig.
            properties:
              conditions:
                description: conditions represent the current state of the MaintainerrConfig
                  resource.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              lastSyncTime:
                description: lastSyncTime is the timestamp of the last successful
                  reconciliation.
                format: date-time
                type: string
              managedResources:
                additionalProperties:
                  items:
                    type: string
                  type: array
                description: |-
                  managedResources records the resources this operator created, keyed by
                  resource type. Prune only removes entries listed here, so resources
                  created outside the operator are never deleted.
                type: object
              observedGeneration:
                description: observedGeneration is the most recent generation observed.
                format: int64
                type: integer
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
