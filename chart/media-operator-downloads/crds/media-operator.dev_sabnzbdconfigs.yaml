---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.23.0
  name: sabnzbdconfigs.media-operator.dev
spec:
  group: media-operator.dev
  names:
    kind: SabnzbdConfig
    listKind: SabnzbdConfigList
    plural: sabnzbdconfigs
    singular: sabnzbdconfig
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.conditions[?(@.type=="Synced")].status
      name: Synced
      type: string
    - jsonPath: .status.conditions[?(@.type=="Ready")].status
      name: Ready
      type: string
    - jsonPath: .status.lastSyncTime
      name: Last Sync
      type: date
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: SabnzbdConfig is the Schema for the sabnzbdconfigs API.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: SabnzbdConfigSpec defines the desired state of SabnzbdConfig.
            properties:
              categories:
                description: categories defines download categories.
                items:
                  description: SabnzbdCategory defines a download category.
                  properties:
                    dir:
                      description: dir is the subdirectory for this category (relative
                        to complete dir).
                      type: string
                    name:
                      description: name is the category name.
                      type: string
                    postProcessing:
                      description: |-
                        postProcessing is how far SABnzbd processes the category's jobs: download
                        only, repair, unpack, or unpack and delete the archives.
                      enum:
                      - download
                      - repair
                      - unpack
                      - delete
                      type: string
                    priority:
                      description: priority is the download priority. -100=default,
                        -2=paused, -1=low, 0=normal, 1=high, 2=force.
                      type: integer
                    script:
                      description: script is the post-processing script for this category.
                      type: string
                  required:
                  - name
                  type: object
                type: array
              connection:
                description: connection defines how to connect to the SABnzbd instance.
                properties:
                  apiKeySecretRef:
                    description: apiKeySecretRef references a Secret containing the
                      API key.
                    properties:
                      key:
                        description: key is the key within the Secret.
                        type: string
                      name:
                        description: name is the name of the Secret.
                        type: string
                    required:
                    - key
                    - name
                    type: object
                  tls:
                    description: |-
                      tls configures TLS settings for the connection.
                      Only needed when the app uses HTTPS with self-signed or private CA certificates.
                    properties:
                      caSecretRef:
                        description: |-
                          caSecretRef references a Secret containing a PEM-encoded CA certificate bundle
                          used to verify the target app's TLS certificate.
                          The Secret must contain the CA certificate under the specified key.
                        properties:
                          key:
                            description: key is the key within the Secret.
                            type: string
                          name:
                            description: name is the name of the Secret.
                            type: string
                        required:
                        - key
                        - name
                        type: object
                      insecureSkipVerify:
                        description: |-
                          insecureSkipVerify disables TLS certificate verification.
                          WARNING: This makes the connection susceptible to machine-in-the-middle attacks.
                          Only use for testing or when the target app uses a self-signed certificate and
                          providing a CA is not practical.
                        type: boolean
                    type: object
                  url:
                    description: url is the base URL of the app (e.g., http://arr-sonarr.arr.svc.cluster.local:8989).
                    type: string
                required:
                - apiKeySecretRef
                - url
                type: object
              folders:
                description: folders configures download and temp folder paths.
                properties:
                  completeDir:
                    description: completeDir is the path for completed downloads.
                    type: string
                  incompleteDir:
                    description: incompleteDir is the path for incomplete downloads.
                    type: string
                  nzbBackupDir:
                    description: nzbBackupDir is the path for NZB backups.
                    type: string
                  scriptDir:
                    description: scriptDir is the path for scripts.
                    type: string
                  tempDownloadDir:
                    description: tempDownloadDir is the temporary download path.
                    type: string
                type: object
              general:
                description: general configures general SABnzbd settings.
                properties:
                  autoSort:
                    description: autoSort sorts the queue by age whenever an NZB is
                      added.
                    type: boolean
                  cacheLimit:
                    description: cacheLimit is the memory used to cache articles,
                      such as 1G.
                    type: string
                  cleanupList:
                    description: cleanupList lists file extensions, without the dot,
                      to delete after a job.
                    items:
                      type: string
                    type: array
                  completeFree:
                    description: |-
                      completeFree is the free space the complete folder needs to keep
                      downloading, such as 10G.
                    type: string
                  deobfuscateFinalFilenames:
                    description: deobfuscateFinalFilenames renames obfuscated files
                      after the job.
                    type: boolean
                  directUnpack:
                    description: directUnpack unpacks a job while it's still downloading.
                    type: boolean
                  downloadFree:
                    description: |-
                      downloadFree is the free space the incomplete folder needs to keep
                      downloading, such as 500M.
                    type: string
                  downloadSpeedLimit:
                    description: downloadSpeedLimit is the download speed limit (e.g.,
                      "100M", "0" for unlimited).
                    type: string
                  enableAllPar:
                    description: enableAllPar downloads every par2 file, not only
                      those a repair needs.
                    type: boolean
                  enableRecursive:
                    description: enableRecursive unpacks archives found inside archives.
                    type: boolean
                  encryptedRarAction:
                    description: encryptedRarAction is what SABnzbd does with a job
                      containing an encrypted RAR.
                    enum:
                    - "off"
                    - pause
                    - fail
                    type: string
                  failHopelessJobs:
                    description: failHopelessJobs fails a job as soon as it can't
                      be completed.
                    type: boolean
                  flatUnpack:
                    description: flatUnpack ignores the folders inside archives when
                      unpacking.
                    type: boolean
                  historyRetention:
                    description: historyRetention decides how long jobs stay in the
                      history.
                    enum:
                    - all
                    - number-archive
                    - number-delete
                    - days-archive
                    - days-delete
                    - all-archive
                    - all-delete
                    type: string
                  historyRetentionNumber:
                    description: historyRetentionNumber is the number of jobs or days
                      historyRetention keeps.
                    minimum: 0
                    type: integer
                  hostWhitelist:
                    description: |-
                      hostWhitelist lists the host names SABnzbd answers on besides IP
                      addresses, localhost and names ending in .local, which cover
                      *.svc.cluster.local. It replaces SABnzbd's list, so it must include the
                      host in connection.url unless that is one of those.
                    items:
                      type: string
                    type: array
                  ignoreSamples:
                    description: ignoreSamples skips sample files.
                    type: boolean
                  pauseOnPostProcessing:
                    description: pauseOnPostProcessing pauses downloading during post-processing.
                    type: boolean
                  permissions:
                    description: permissions are the octal permissions set on completed
                      downloads, such as 775.
                    pattern: ^[0-7]{3,4}$
                    type: string
                  preCheck:
                    description: preCheck enables NZB pre-check for completion.
                    type: boolean
                  propagationDelay:
                    description: propagationDelay holds back jobs posted less than
                      this many minutes ago.
                    minimum: 0
                    type: integer
                  safePostProcessing:
                    description: safePostProcessing post-processes only jobs that
                      passed verification.
                    type: boolean
                  scriptCanFail:
                    description: scriptCanFail lets a job's post-processing script
                      fail without failing the job.
                    type: boolean
                  scriptDir:
                    description: |-
                      scriptDir is the path to the scripts directory.
                      Deprecated: use folders.scriptDir, which takes precedence when both are set.
                    type: string
                  sfvCheck:
                    description: sfvCheck verifies jobs without par2 files against
                      their SFV files.
                    type: boolean
                  topOnly:
                    description: topOnly fetches articles only for the job at the
                      top of the queue.
                    type: boolean
                  unwantedExtensions:
                    description: |-
                      unwantedExtensions lists file extensions, without the dot, that
                      unwantedExtensionsAction applies to.
                    items:
                      type: string
                    type: array
                  unwantedExtensionsAction:
                    description: |-
                      unwantedExtensionsAction is what SABnzbd does with a job containing an
                      unwanted extension.
                    enum:
                    - "off"
                    - pause
                    - fail
                    type: string
                  unwantedExtensionsMode:
                    description: |-
                      unwantedExtensionsMode decides whether unwantedExtensions lists the
                      extensions to act on or the only ones allowed.
                    enum:
                    - blocklist
                    - allowlist
                    type: string
                type: object
              reconcile:
                description: reconcile configures reconciliation behavior (e.g., sync
                  interval).
                properties:
                  deletionPolicy:
                    description: |-
                      deletionPolicy controls what happens to resources in the app when this CR
                      is deleted. "orphan" leaves them in place, "delete" removes the resources
                      the operator created.
                      Default: orphan.
                    enum:
                    - orphan
                    - delete
                    type: string
                  driftPolicy:
                    description: |-
                      driftPolicy controls whether drift is corrected or only recorded.
                      "enforce" rewrites a resource whose live state differs from this CR.
                      "observe" leaves the app untouched and only counts the difference, which
                      makes drift measurable before handing the operator write authority.
                      Default: enforce.
                    enum:
                    - enforce
                    - observe
                    type: string
                  interval:
                    description: |-
                      interval overrides the default reconciliation interval (default: 5m).
                      Uses standard Kubernetes duration format (e.g., "30s", "5m", "1h").
                    type: string
                  prune:
                    description: |-
                      prune deletes resources the operator created, tracked in
                      status.managedResources, once they are removed from this spec. Resources
                      it did not create are never deleted, and a resource type with nothing
                      declared is left alone. Root folders and tags are never pruned.
                      Not every integration supports prune; one that does not rejects it with
                      InvalidConfig rather than ignoring it.
                      Default: false (only create/update, never delete).
                    type: boolean
                type: object
              servers:
                description: servers defines Usenet server connections.
                items:
                  description: SabnzbdServer defines a Usenet server connection.
                  properties:
                    connections:
                      description: connections is the number of simultaneous connections.
                      type: integer
                    enable:
                      default: true
                      description: enable controls whether this server is active.
                      type: boolean
                    host:
                      description: host is the hostname of the Usenet server.
                      type: string
                    name:
                      description: name is the display name of the server.
                      type: string
                    optional:
                      description: optional lets SABnzbd stop using the server for
                        a while when it fails.
                      type: boolean
                    passwordSecretRef:
                      description: passwordSecretRef references a Secret containing
                        the password.
                      properties:
                        key:
                          description: key is the key within the Secret.
                          type: string
                        name:
                          description: name is the name of the Secret.
                          type: string
                      required:
                      - key
                      - name
                      type: object
                    port:
                      description: port is the port number.
                      type: integer
                    priority:
                      description: priority is the server priority. 0 = highest.
                      type: integer
                    required:
                      description: |-
                        required makes SABnzbd wait for the server when it fails instead of
                        skipping it.
                      type: boolean
                    retention:
                      description: retention is the server retention in days. 0 =
                        unlimited.
                      type: integer
                    ssl:
                      description: ssl enables SSL/TLS connection.
                      type: boolean
                    sslVerify:
                      description: sslVerify is how strictly the server's certificate
                        is checked when ssl is on.
                      enum:
                      - strict
                      - medium
                      - minimal
                      - disabled
                      type: string
                    timeout:
                      description: timeout is how many seconds SABnzbd waits for the
                        server to answer.
                      minimum: 1
                      type: integer
                    usernameSecretRef:
                      description: usernameSecretRef references a Secret containing
                        the username.
                      properties:
                        key:
                          description: key is the key within the Secret.
                          type: string
                        name:
                          description: name is the name of the Secret.
                          type: string
                      required:
                      - key
                      - name
                      type: object
                  required:
                  - host
                  - name
                  - port
                  type: object
                type: array
            required:
            - connection
            type: object
          status:
            description: SabnzbdConfigStatus defines the observed state of SabnzbdConfig.
            properties:
              conditions:
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              lastSyncTime:
                format: date-time
                type: string
              managedResources:
                additionalProperties:
                  items:
                    type: string
                  type: array
                description: |-
                  managedResources records the resources this operator created, keyed by
                  resource type. Prune only removes entries listed here, so resources
                  created outside the operator are never deleted.
                type: object
              observedGeneration:
                format: int64
                type: integer
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
