apiVersion: media-operator.dev/v1alpha1
kind: AutobrrConfig
metadata:
  name: autobrr
spec:
  connection:
    url: ${URL}
    apiKeySecretRef:
      name: compat-credentials
      key: api-key
  downloadClients:
    - name: qBittorrent
      type: qBittorrent
      enable: true
      host: http://${HOST}
      port: ${QBITTORRENT_PORT}
      usernameSecretRef:
        name: compat-credentials
        key: qbittorrent-username
      passwordSecretRef:
        name: compat-credentials
        key: qbittorrent-password
    - name: Sonarr
      type: Sonarr
      enable: true
      host: http://${HOST}:8989
      apiKeySecretRef:
        name: compat-credentials
        key: sonarr-api-key
  indexers:
    - name: IPTorrents
      identifier: ipt
      enable: false
      settings:
        - name: passkey
          valueFrom:
            name: compat-credentials
            key: ipt-passkey
    - name: Compat Torznab
      identifier: torznab
      enable: false
  feeds:
    - name: Compat Torznab
      type: Torznab
      enable: false
      url: http://${HOST}:9117/api
      interval: 30
      indexerRef: Compat Torznab
      apiKeySecretRef:
        name: compat-credentials
        key: torznab-api-key
  ircNetworks:
    - name: Compat IRC
      enable: false
      server: irc.example.invalid
      port: 6697
      tls: true
      nick: compat-bot
      authMechanism: None
      channels:
        - name: "#announce"
  filters:
    - name: TV - 1080p
      enable: true
      priority: 1
      indexers:
        - IPTorrents
      tags:
        - tv
        - hd
      resolutions:
        - 1080p
      sources:
        - WEB-DL
      matchHdr:
        - DV
      exceptReleaseGroups: BAD
      exceptTags:
        - cam
        - ts
      tagsMatchLogic: ANY
      maxDownloads: 5
      maxDownloadsUnit: DAY
      freeleech: true
      freeleechPercent: 100%
      minSeeders: 2
      smartEpisode: true
      seasons: 1-10
      origins:
        - P2P
        - INTERNAL
      actions:
        - name: Send to qBittorrent
          type: qBittorrent
          enable: true
          clientRef: qBittorrent
          category: tv
          tags: autobrr
          paused: false
          skipHashCheck: true
          contentLayout: SUBFOLDER_CREATE
          limitRatio: 1.5
          limitSeedTime: 1440
          reannounceSkip: false
          reannounceInterval: 7
          reannounceMaxAttempts: 50
