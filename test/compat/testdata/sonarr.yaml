apiVersion: media-operator.dev/v1alpha1
kind: SonarrConfig
metadata:
  name: sonarr
spec:
  connection:
    url: ${URL}
    apiKeySecretRef:
      name: compat-credentials
      key: api-key
  mediaManagement:
    copyUsingHardlinks: true
    deleteEmptyFolders: true
    importExtraFiles: true
    extraFileExtensions: srt
    downloadPropersAndRepacks: preferAndUpgrade
    enableMediaInfo: true
    rescanAfterRefresh: always
    episodeTitleRequired: always
    minimumFreeSpaceWhenImporting: 100
  naming:
    renameEpisodes: true
    replaceIllegalCharacters: true
    colonReplacementFormat: 4
    multiEpisodeStyle: 5
    standardEpisodeFormat: "{Series TitleYear} - S{season:00}E{episode:00} - {Episode CleanTitle} [{Quality Full}]{-Release Group}"
    dailyEpisodeFormat: "{Series TitleYear} - {Air-Date} - {Episode CleanTitle} [{Quality Full}]{-Release Group}"
    animeEpisodeFormat: "{Series TitleYear} - S{season:00}E{episode:00} - {absolute:000} - {Episode CleanTitle} [{Quality Full}]{-Release Group}"
    seriesFolderFormat: "{Series TitleYear} [tvdbid-{TvdbId}]"
    seasonFolderFormat: "Season {season:00}"
    specialsFolderFormat: Specials
  indexerConfig:
    minimumAge: 0
    retention: 0
    maximumSize: 0
    rssSyncInterval: 15
  downloadClientConfig:
    enableCompletedDownloadHandling: true
    autoRedownloadFailed: true
    autoRedownloadFailedFromInteractiveSearch: true
  ui:
    firstDayOfWeek: 1
    shortDateFormat: "MMM D YYYY"
    longDateFormat: "dddd, MMMM D YYYY"
    timeFormat: "h(:mm)a"
    showRelativeDates: true
    theme: dark
    enableColorImpairedMode: false
    uiLanguage: 1
  rootFolders:
    - path: /data/media/tv
  remotePathMappings:
    - host: ${HOST}
      remotePath: /downloads/tv
      localPath: /data/media/tv
  tags:
    - label: anime
    - label: hdr
  downloadClients:
    - name: qBittorrent
      protocol: torrent
      implementation: QBittorrent
      host: ${HOST}
      port: ${QBITTORRENT_PORT}
      category: tv
      priority: 1
      removeCompletedDownloads: true
      removeFailedDownloads: true
      tagLabels:
        - hdr
      usernameSecretRef:
        name: compat-credentials
        key: qbittorrent-username
      passwordSecretRef:
        name: compat-credentials
        key: qbittorrent-password
  customFormats:
    - name: x265 (HD)
      includeCustomFormatWhenRenaming: false
      specifications:
        - name: x265
          implementation: ReleaseTitleSpecification
          negate: false
          required: true
          fields:
            - name: value
              value: "[xh]\\.?265|HEVC"
        - name: Not 4K
          implementation: ResolutionSpecification
          negate: true
          required: true
          fields:
            - name: value
              value: 2160
    - name: WEBDL
      specifications:
        - name: WEBDL
          implementation: SourceSpecification
          fields:
            - name: value
              value: 3
  qualityProfiles:
    - name: HD-1080p
      upgradeAllowed: true
      cutoff: Bluray-1080p
      minFormatScore: 0
      cutoffFormatScore: 10000
      minUpgradeFormatScore: 1
      items:
        - quality:
            id: 0
            name: Unknown
          allowed: false
        - quality:
            id: 1
            name: SDTV
          allowed: false
        - name: WEB 720p
          allowed: false
          items:
            - quality:
                id: 5
                name: WEBDL-720p
            - quality:
                id: 14
                name: WEBRip-720p
        - name: WEB 1080p
          allowed: true
          items:
            - quality:
                id: 3
                name: WEBDL-1080p
            - quality:
                id: 15
                name: WEBRip-1080p
        - quality:
            id: 7
            name: Bluray-1080p
          allowed: true
        - quality:
            id: 20
            name: Bluray-1080p Remux
          allowed: true
      formatItems:
        - name: x265 (HD)
          score: -5000
        - name: WEBDL
          score: 1000
  indexers:
    - name: Compat Torznab
      protocol: torrent
      implementation: Torznab
      enableRss: true
      enableAutomaticSearch: true
      enableInteractiveSearch: true
      priority: 10
      tagLabels:
        - anime
      fields:
        - name: baseUrl
          value: ${FAKES}/torznab
        - name: apiPath
          value: /api
        - name: apiKey
          valueFrom:
            name: compat-credentials
            key: api-key
        - name: categories
          value: [5000, 5040]
        - name: minimumSeeders
          value: 1
  notifications:
    - name: Compat Webhook
      implementation: Webhook
      onGrab: true
      onDownload: true
      onImportComplete: true
      onUpgrade: true
      onRename: true
      onHealthIssue: true
      onHealthRestored: true
      includeHealthWarnings: true
      onSeriesAdd: true
      onSeriesDelete: true
      onEpisodeFileDelete: true
      onEpisodeFileDeleteForUpgrade: true
      onApplicationUpdate: true
      onManualInteractionRequired: true
      tagLabels:
        - hdr
      fields:
        - name: url
          value: ${FAKES}/webhook
        - name: method
          value: 1
  importLists:
    - name: Compat List
      implementation: CustomImport
      enableAutomaticAdd: false
      monitor: all
      qualityProfileName: HD-1080p
      rootFolderPath: /data/media/tv
      seriesType: standard
      seasonFolder: true
      fields:
        - name: baseUrl
          value: ${FAKES}/lists/sonarr
  qualityDefinitions:
    - quality: HDTV-720p
      minSize: 10
      maxSize: 67.5
      preferredSize: 50
    - quality: Bluray-1080p
      title: Blu-ray 1080p
      minSize: 50.4
      maxSize: 0
      preferredSize: 0
  delayProfiles:
    - tagLabels:
        - anime
      preferredProtocol: torrent
      usenetDelay: 60
      bypassIfAboveCustomFormatScore: true
      minimumCustomFormatScore: 100
    - tagLabels:
        - hdr
      enableUsenet: false
    - usenetDelay: 30
      torrentDelay: 10
